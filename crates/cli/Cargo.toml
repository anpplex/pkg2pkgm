[package]
name = "pkg2mpkg"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
clap.workspace = true
pkg2mpkg-codecs = { path = "../codecs" }
pkg2mpkg-core = { path = "../core" }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
pkg2mpkg-fixtures = { path = "../fixtures" }
predicates.workspace = true
tempfile.workspace = true

# CLI-local name avoids colliding with the codecs test helper binary.
[[bin]]
name = "pkg2mpkg-cli-fake-resource-compiler"
path = "../codecs/tests/support/fake_resource_compiler_helper.rs"
test = false
bench = false
